name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-v2
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          APK="$(find android -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "APK was not produced"
            exit 1
          fi
          cp "$APK" PersianTranscriber-android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianTranscriber-android-debug
          path: PersianTranscriber-android-debug.apk
          if-no-files-found: error
          retention-days: 14
